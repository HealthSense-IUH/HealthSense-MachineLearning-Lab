name: MLOps Release Pipeline

on:
  push:
    tags:
      - 'v*' # Chỉ chạy khi có tag bắt đầu bằng chữ 'v' (VD: v4.0.0)

jobs:
  train-and-release:
    runs-on: ubuntu-latest

    # Cấp quyền GITHUB_TOKEN để được phép tạo Release trên repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cài đặt thư viện (Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline v4 — Trích xuất đặc trưng (tự tải dữ liệu)
        run: python scripts/run_v4_extraction.py

      - name: Pipeline v4 — LOSO Benchmark (chống data leakage)
        run: python scripts/run_v4_benchmark.py

      - name: Pipeline v4 — Cross-Dataset MIMIC <-> AFDB
        run: python scripts/run_cross_dataset.py

      - name: Đóng gói kết quả (Zip Results)
        run: |
          zip -r healthsense_afib_v4_results.zip models/benchmark_v4 models/cross_dataset data/features/mimic_features_v4.csv data/features/afdb_features_v4.csv

      - name: Tạo Github Release & Đính kèm kết quả
        uses: softprops/action-gh-release@v2
        with:
          files: healthsense_afib_v4_results.zip
          name: Release ${{ github.ref_name }}
          body: |
            🎉 **HealthSense ML v4 — Phát hiện Rung Nhĩ (AFib), không data leakage**

            Bản phát hành tự động bởi GitHub Actions:
            - **Đánh giá:** Leave-One-Subject-Out theo bệnh nhân (MIMIC PERform AF) + Cross-Dataset MIMIC ↔ MIT-BIH AFDB.
            - **Kết quả LOSO mức bệnh nhân:** Recall 100% (0 FN), Accuracy 94.3%, ROC-AUC 0.93 (Random Forest).
            - **Nội dung:** metrics CSV, dự đoán từng cửa sổ, biểu đồ, bảng đặc trưng có `record_id`.

            *Chi tiết phương pháp: README mục "Vì sao có v4?" và `docs/pipeline_v4.html`.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
