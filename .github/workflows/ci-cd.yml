name: MLOps Release Pipeline

on:
  push:
    tags:
      - 'v*' # Chỉ chạy khi có tag bắt đầu bằng chữ 'v' (VD: v1.0.0, v2.1-final)

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    
    # Cấp quyền GITHUB_TOKEN để được phép tạo Release trên repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Tăng tốc độ cài đặt thư viện cho các lần sau

      - name: Cài đặt thư viện (Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tự động Huấn luyện & Đóng gói Mô hình (MLOps Training)
        run: |
          echo "Bắt đầu chạy Jupyter Notebooks để huấn luyện AI..."
          jupyter nbconvert --to notebook --execute notebooks/03_model_evaluation.ipynb
          jupyter nbconvert --to notebook --execute notebooks/04_stacking_ensemble.ipynb

      - name: Đóng gói Mô hình (Zip Models)
        run: |
          echo "Nén các file .pkl thành file ZIP để phát hành..."
          zip -r healthsense_afib_models.zip models/

      - name: Tạo Github Release & Đính kèm Mô hình
        uses: softprops/action-gh-release@v2
        with:
          files: healthsense_afib_models.zip
          name: Release ${{ github.ref_name }}
          body: |
            🎉 **Bộ mô hình AI HealthSense phát hiện Rung tâm nhĩ (AFib)**
            
            Bản phát hành này được tự động tạo ra bởi hệ thống MLOps Github Action.
            - **Đầu vào:** Tập dữ liệu 16 đặc trưng HRV (`data/features/mimic_train_features_advanced.csv`)
            - **Thuật toán chính:** 
              - `mimic_afib_pipeline.pkl`: Mô hình LightGBM Pipeline (Accuracy 97.10%, Recall 99.17%)
              - `mimic_stacking_pipeline.pkl`: Mô hình Stacking Ensemble 2 tầng (LGBM + ExtraTrees + SVM + Meta LR)
            - **Thành phẩm:** Đóng gói trong file `healthsense_afib_models.zip`.
            
            *Hãy tải và giải nén file `healthsense_afib_models.zip` để lấy mô hình `.pkl` nạp vào Backend FastAPI (`HealthSense-AI-Service`).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
